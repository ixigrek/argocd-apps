---
# App of Apps — prod cluster
# Apply this once manually to bootstrap GitOps on the prod cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:SimonJaricot/argocd-apps.git
    targetRevision: HEAD
    path: clusters/prod
  destination:
    server: https://kubernetes.default.svc  # update with prod cluster API server URL
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
