---
# ArgoCD self-managed Application
# ArgoCD watches this repo and manages its own Helm deployment
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:SimonJaricot/argocd-apps.git
    targetRevision: HEAD
    path: helm/argocd
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false      # Never auto-delete ArgoCD's own resources
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
